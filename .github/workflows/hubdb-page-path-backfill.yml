name: Backfill HubDB Page Paths

on:
  schedule:
    - cron: '0 2,6,10 * * 2,3'   # Tue & Wed, every 4h 09:00-17:00 ICT (02:00/06:00/10:00 UTC)
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Backfill Page Paths for hot-issue / asset-class-outlook topics
        run: python3 scripts/backfill_page_paths.py --live
        env:
          HUBSPOT_ACCESS_KEY: ${{ secrets.HUBSPOT_ACCESS_KEY }}
