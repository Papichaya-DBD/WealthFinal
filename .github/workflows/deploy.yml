name: Deploy to HubSpot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install HubSpot CLI
        run: npm install -g @hubspot/cli

      - name: Configure HubSpot CLI
        run: |
          mkdir -p ~/.hscli
          cat > ~/.hscli/config.yml << EOF
          defaultAccount: 43844850
          accounts:
            - name: yuanta-wealth
              accountId: 43844850
              authType: personalaccesskey
              personalAccessKey: "${{ secrets.HUBSPOT_ACCESS_KEY }}"
              accountType: STANDARD
          EOF

      - name: Upload to HubSpot
        run: hs cms upload ./ yuanta-wealth-theme --account yuanta-wealth
