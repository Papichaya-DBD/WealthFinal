name: Deploy to HubSpot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install HubSpot CLI
        run: npm install -g @hubspot/cli

      - name: Configure HubSpot CLI
        run: |
          mkdir -p ~/.config/@hubspot/cli
          cat > ~/.config/@hubspot/cli/config.yml << EOF
          defaultPortal: "43844850"
          portals:
            - name: yuanta-wealth
              portalId: 43844850
              authType: personalaccesskey
              personalAccessKey: "${{ secrets.HUBSPOT_ACCESS_KEY }}"
          EOF

      - name: Upload to HubSpot
        run: hs cms upload yuanta-wealth-theme yuanta-wealth-theme --account yuanta-wealth
